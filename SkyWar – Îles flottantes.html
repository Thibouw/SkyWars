<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>SkyWar – Îles flottantes</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e8f1f7;--s1:#7fb8e6;--s2:#f3e6cf;--card:#fffdf8;--tx:#1d3347;--mut:#667f93;--p:#1f6fd1;--e:#c8372f;--n:#8b8f94;--br:#b8893a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a29;--s1:#16304e;--s2:#5a4a63;--card:#172a40;--tx:#e8f0f8;--mut:#94abc2;--p:#5aa2ff;--e:#ff6b61;--n:#a1a6ac;--br:#e0b25c}}
:root[data-theme="dark"]{--bg:#0e1a29;--s1:#16304e;--s2:#5a4a63;--card:#172a40;--tx:#e8f0f8;--mut:#94abc2;--p:#5aa2ff;--e:#ff6b61;--n:#a1a6ac;--br:#e0b25c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
html,body{height:100%}#app{box-sizing:border-box;width:100%;height:100%;display:flex;flex-direction:column;padding:10px}#bot{flex:0 1 auto;max-height:40%;overflow:auto;min-height:0}#app.vi #bot{flex:1 1 auto;max-height:none}
header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:8px}
h1{font:700 24px Georgia,serif;margin:0;color:var(--br)}
button{font:inherit;color:var(--tx);background:var(--card);border:1.5px solid var(--br);border-radius:8px;padding:6px 10px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:3px solid var(--p)}
button.on{background:var(--br);color:#fff}
#map{position:relative;flex:1 1 auto;min-height:240px;border-radius:14px;overflow:hidden;background:linear-gradient(var(--s1),var(--s2))}
.isl{position:absolute;transform:translate(-50%,-50%);background:#0000;border:0;padding:2px;text-align:center;display:flex;flex-direction:column;align-items:center;border-radius:12px}
.isl i{font-size:clamp(28px,7vw,52px);font-style:normal;line-height:1}
.isl b{font-size:12px;color:var(--lb,var(--tx));text-shadow:0 0 3px var(--lt,#fff8)}.isl small{font-size:11px;background:var(--card);border:2px solid var(--n);border-radius:9px;padding:0 5px;white-space:nowrap}
.isl.p small{border-color:var(--p)}.isl.e small{border-color:var(--e)}.isl.sel{outline:3px solid var(--br)}
#fl{position:absolute;inset:0;pointer-events:none}
#go{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;font:700 20px Georgia,serif;padding:14px 26px;background:var(--br);color:#fff;border:0;border-radius:12px}
.pre .isl,.pre #panel,.pre #log,.pre #sum{visibility:hidden}.pre #bot{display:none}#md{position:absolute;left:50%;top:calc(50% + 90px);transform:translateX(-50%);z-index:2;display:flex;gap:8px}#md button{font:600 13px Georgia,serif;padding:6px 12px;border:1.5px solid var(--br);background:var(--card);color:var(--tx);border-radius:10px}#md button.on{background:var(--br);color:#fff}#md small{display:block;font:400 11px system-ui,sans-serif;margin-top:2px}
.fl{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;font-size:12px}.fl>small{background:var(--card);border:2px solid var(--p);border-radius:8px;padding:0 4px;font-size:11px;white-space:nowrap}.fl.e>small{border-color:var(--e)}
.ln{stroke-width:2;stroke-dasharray:6 6;vector-effect:non-scaling-stroke;opacity:.85}.ln.p{stroke:var(--p)}.ln.e{stroke:var(--e)}
#panel{position:relative;background:var(--card);border-radius:12px;padding:10px 14px;margin-top:10px}
#panel h2{padding-right:52px}.mapb{position:absolute;top:8px;right:10px;font-size:20px;padding:2px 8px}
#sum{background:var(--card);border-radius:12px;padding:8px 14px;margin-top:10px;font-size:14px}#sum h3{margin:0 0 4px}
#how{position:absolute;left:50%;top:calc(50% + 46px);transform:translateX(-50%);z-index:2;font:700 14px Georgia,serif;padding:7px 18px;background:var(--br);color:#fff;border:0;border-radius:10px}
#tu{position:fixed;inset:0;z-index:10;background:#000a;display:flex;align-items:center;justify-content:center;padding:10px}#tu[hidden]{display:none}#tu .cd{background:var(--card);border-radius:14px;padding:16px 20px;max-width:680px;max-height:100%;overflow:auto;font-size:14px}#tu h2{margin:0 0 6px}#tu h3{margin:12px 0 3px}#tu ul,#tu ol{margin:3px 0;padding-left:20px}#tu li{margin:2px 0}#tx{display:block;margin:14px auto 0;padding:8px 26px}
.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1;font-size:13px;padding:6px 4px}.tabs button.lk{opacity:.4}
.bub{position:relative;margin:2px 0 8px;padding:7px 12px;background:#fffdf5;border:1.5px solid #b8893a;border-radius:8px;color:#1d3347;font-size:12.5px;line-height:1.4;text-align:center}
.bub b{display:block;font-size:12.5px}
.bub::before,.bub::after{content:'';position:absolute;bottom:100%;border-style:solid;border-color:transparent}
.bub::before{right:18%;border-width:0 9px 9px;border-bottom-color:#b8893a}
.bub::after{right:calc(18% + 1.6px);border-width:0 7px 7.5px;border-bottom-color:#fffdf5}
.bub.flo::before{right:50%;margin-right:-9px}
.bub.flo::after{right:50%;margin-right:-7.6px}
.il{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px;margin-top:6px}@media(max-width:760px){.il{grid-template-columns:1fr}}
.ilv{background:radial-gradient(ellipse at 20% 15%,#fff8 0,#fff0 40%),radial-gradient(ellipse at 80% 70%,#fff6 0,#fff0 35%),linear-gradient(var(--s1),var(--s2));border-radius:12px;padding:4px;display:flex;flex-direction:column;justify-content:center}
.ilv .iso{max-width:none;margin:0;max-height:calc(100vh - 230px)}
.ilh{background:var(--br);color:#fff;border-radius:10px;padding:8px 10px}.ilh h2{margin:0 0 4px;padding-right:44px}.rs{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px}
.ilp .g{grid-template-columns:repeat(2,1fr)}.ilp .g small{font-size:11px}
#alert{display:flex;align-items:center;background:var(--e);color:#fff;border-radius:10px;padding:8px 12px;margin-bottom:8px}#alert[hidden]{display:none}#alert button{margin-left:8px}#alert .ax{margin-left:auto;padding:2px 9px}
#bv{position:fixed;inset:0;z-index:8;background:#08181f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;color:#dff}#bv[hidden]{display:none}#cv{width:min(100%,1300px,calc((100vh - 130px)*1.607));height:auto;border-radius:14px;border:3px solid #35566a;background:radial-gradient(#13a396,#0a5b63)}#bt{font-size:17px}
h2{font:700 19px Georgia,serif;margin:0}h3{font-size:14px;margin:12px 0 4px}p{margin:4px 0}
em{font-style:normal;font-size:12px;border-radius:6px;padding:1px 6px;color:#fff;background:var(--n)}em.p{background:var(--p)}em.e{background:var(--e)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.g button{text-align:left}.g small{display:block;color:var(--mut);font-size:12px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0}.row span{flex:1;min-width:160px}.row button[data-m]{min-width:38px;font-weight:700}.row b{min-width:2ch;text-align:center}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;max-width:380px}.cell{aspect-ratio:1;padding:0;font-size:22px;background:var(--bg)}.cell.b{background:var(--card)}.cell.w{opacity:.5;border-style:dashed}
.iso{display:block;width:100%;max-width:520px;height:auto;margin:6px auto}.rk{pointer-events:none}.ic{height:18px;width:auto;vertical-align:middle;filter:drop-shadow(0 0 1.5px #fff)}.tile{cursor:pointer}.tt{fill:transparent;pointer-events:all}.iso image,.iso use{pointer-events:none}.tile.e .tt{fill:rgba(255,255,255,.4)}.tile.s .tt{stroke:#d4a017;stroke-width:3;fill:rgba(255,230,120,.25)}.tile:hover .tt{fill:rgba(255,255,255,.2)}.isl svg{display:block;margin:0 auto}.iso text{pointer-events:none}.cell.s{outline:3px solid var(--br)}.det{margin:8px 0;padding:8px 10px;border-left:4px solid var(--br);background:var(--bg);border-radius:6px;font-size:14px}
.det .des{display:block;margin-top:6px;border-color:var(--e);color:var(--e);font-size:12.5px;padding:4px 8px}
.m{color:var(--mut)}#log{margin-top:8px;color:var(--mut);font-size:13px;min-height:5em}
#ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9}
#ov[hidden]{display:none}#ov div{background:var(--card);padding:24px 30px;border-radius:14px;text-align:center}

/* adaptation automatique selon l'écran (téléphone, tablette, paysage) */
.il{align-items:start}
@media(min-width:761px){.ilv{position:sticky;top:0;align-self:start}}
@media(pointer:coarse){.g button,.tabs button,#spd button,.row button,#alert button,.mapb,.det button{min-height:42px}}
@media(max-width:760px){header h1{display:none}header{margin-bottom:6px}header button{padding:5px 9px;font-size:13px}#res{font-size:12px}#app{padding:6px}.ilv .iso{max-height:36vh}.ilp .g small{font-size:10.5px}.tabs button{font-size:12px}}
@media(max-height:520px){header h1{display:none}header{margin-bottom:4px}header button{padding:3px 8px;font-size:12px}#res{font-size:12px}#app{padding:4px}.il{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}.ilv .iso{max-height:calc(100vh - 80px)}#panel{padding:6px 10px}#bot{max-height:45%}#bv{padding:4px;gap:4px}#cv{width:min(100%,calc((100vh - 80px)*1.607))}#bt{font-size:14px}}
.ic.s{height:11px;width:auto}.cl{display:flex;flex-wrap:wrap;justify-content:center;gap:1px 2px;max-width:96px}.cl.fc{display:grid;grid-template-columns:repeat(4,auto);justify-items:center;max-width:none}.cl.hv img{animation:hv 2.4s ease-in-out infinite}.cl small{font:10px system-ui,sans-serif;color:var(--tx);background:none;border:0;padding:0}@keyframes hv{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
#dj{position:absolute;left:10px;top:8px;z-index:1;background:var(--card);border:2px solid var(--br);border-radius:10px;padding:3px 10px;font:700 13px Georgia,serif;color:var(--tx)}.pre #dj{display:none}
.tile .tt.pv{fill:rgba(255,226,110,.6);stroke:#d4a017;stroke-width:2}.tile .tt.pvx{fill:rgba(224,69,58,.5)}
#sk{position:absolute;font-size:26px;pointer-events:none;z-index:0;transform:translate(-50%,-50%);filter:drop-shadow(0 0 6px #fff8)}
#map::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:var(--st,0);background-image:radial-gradient(1.5px 1.5px at 8% 14%,#fff,#0000),radial-gradient(1.5px 1.5px at 19% 31%,#fff,#0000),radial-gradient(1px 1px at 31% 9%,#fff,#0000),radial-gradient(1.5px 1.5px at 44% 24%,#fff,#0000),radial-gradient(1px 1px at 57% 11%,#fff,#0000),radial-gradient(1.5px 1.5px at 66% 35%,#fff,#0000),radial-gradient(1px 1px at 78% 17%,#fff,#0000),radial-gradient(1.5px 1.5px at 89% 28%,#fff,#0000),radial-gradient(1px 1px at 93% 8%,#fff,#0000),radial-gradient(1px 1px at 25% 46%,#fff,#0000),radial-gradient(1px 1px at 72% 48%,#fff,#0000)}
.iso{overflow:visible}

<h3>Le but</h3><p>Éliminer l’ennemi en prenant toutes ses îles. Tu perds si tu perds toutes les tiennes.</p>
<h3>La carte et les îles</h3><p>Clique sur <b>une de tes îles</b> pour la gérer (le bouton 🗺️ ramène à la carte). Clique sur <b>une autre île</b> pour y envoyer une flotte. Chaque île a son <b>propre stock</b> de bois 🪵 et d’éther ⛽, sa population, ses bâtiments et ses compétences.</p>
<h3>Bien démarrer</h3><ol><li>Clique sur ton île et place ton <b>Palais</b> (gratuit et instantané) : il produit du bois, nourrit l’île et la défend.</li><li>Construis une <b>Pompe</b> pour produire de l’éther.</li><li>Puis un <b>Aérodrome</b> : sans lui, aucune unité ne peut être fabriquée sur l’île.</li><li>Fabrique des vaisseaux, et des Fermes pour faire grandir la population.</li></ol>
<h3>Bâtiments</h3><p>Choisis-en un dans l’onglet Construction, puis clique sur une case libre du quadrillage. Certaines cases portent un <b>cratère</b> : une Pompe posée dessus produit trois fois plus d’éther. Un bâtiment déjà construit peut être <b>détruit</b> (sélectionne-le sur l’île, puis bouton « Détruire ») : vous récupérez <b>40 %</b> des ressources dépensées. L’ennemi en fait autant quand il manque de place pour s’aufrager.</p><ul>${bl}</ul>
<h3>Population</h3><p>Elle grandit tant que la nourriture dépasse la population (base 3, Palais +5, Ferme +2). Plus une île est peuplée, plus elle produit et construit vite. Chaque vaisseau coûte des habitants, retirés quand il sort de la file.</p>
<h3>Vaisseaux</h3><ul>${ul}</ul><p>Leur nombre est <b>limité</b> (compteur ⚓ en haut de l’écran) : chaque vaisseau compte autant que son coût en habitants, en comptant ceux en route et ceux en fabrication. Une <b>Caserne</b> ajoute 2 à la limite.</p>
<h3>Flottes</h3><p>Une flotte avance à la vitesse de son vaisseau le plus lent, et la ligne « Trajet » indique la durée avant de l’envoyer. Pour déplacer des unités entre tes îles, ouvre l’île qui les reçoit et clique sur <b>« Envoyer des renforts sur cette île »</b> sous la file de fabrication (ou onglet Flotte si tu as un Aérodrome).</p>
<h3>Combat</h3><p>Il se joue par tours : chaque vaisseau tire sur une cible. Les attaquants visent d’abord la garnison, puis les Forts, puis les autres bâtiments, et le Palais en dernier. Un bâtiment détruit disparaît. Une partie des tirs est « intelligente » (elle vise l’ennemi le plus affaibli) : les compétences en augmentent la part. À forces égales, c’est quasiment pile ou face : prévois un vaisseau d’avance. Les capitales ont 25 % de PV en plus.</p>
<h3>Conquête</h3><p>Pour occuper une île, ta flotte doit contenir au moins un <b>Colosse</b> (très lent, très solide, sans attaque) : sans lui, tu peux tout détruire mais l’île devient simplement neutre. En prenant une île neutre, tu gardes son bâtiment et tu places un <b>Palais gratuit</b> qui lui donne des ressources et la défend. Une île prise à l’ennemi repart sans bâtiments, mais tu y places aussi un <b>Palais gratuit</b>.</p>
<h3>Compétences</h3><p>Une île qui possède une <b>Université</b> (un carré de 2×2 cases) peut apprendre des compétences (onglet Compétences) : tirs plus précis, flottes plus rapides, meilleure production, fabrication plus rapide.</p>
<h3>Les jours</h3><p>Le jeu est rythmé par des <b>jours</b> (des « cycles » dans l’original) : à la fin de chacun, chaque île reçoit sa production de bois et d’éther. Un jour dure <b>15 secondes</b> en mode <b>Rapide</b>, <b>45 secondes</b> en <b>Posé</b> et <b>7 min 30</b> en <b>Classique</b>, comme dans l’original. Tu choisis le rythme sur l’écran d’accueil.</p><h3>Le temps</h3><p>Le bouton ⏸ Pause gèle le jeu : tu peux alors construire et envoyer des flottes tranquillement, et ⏭ Jour (actif en pause) avance jusqu’au prochain jour. ⏩ ×3 accélère le temps (utile en solo). Quand une bataille te concerne, une bannière te propose de la regarder.</p>
